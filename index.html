<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome Animation</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .welcome {
      color: white;
      font-size: 4rem;
      font-weight: bold;
      margin-bottom: 30px;
      animation: glow 2s infinite alternate,
                 float 3s ease-in-out infinite;
    }

    .btn {
      padding: 14px 28px;
      background: #38bdf8;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 1.2rem;
      transition: 0.3s;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
    }

    .btn:hover {
      background: #f472b6;
      transform: scale(1.08);
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 10px #38bdf8,
                     0 0 20px #38bdf8;
      }
      to {
        text-shadow: 0 0 20px #f472b6,
                     0 0 40px #f472b6;
      }
    }

    @keyframes float {
      0% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-15px);
      }
      100% {
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="welcome">Welcome to My GitHub Page 🚀</div>

  <!-- Assignment Link -->
  <a class="btn" href="arham1.html">
    View My Assignment
  </a>

</body>
</html>
